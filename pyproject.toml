[project]
name = "rmdm"
version = "0.1.0"
description = "Typed multimodal decisions from frozen Gemma 4 logits, fully local"
readme = "README.md"
authors = [{ name = "Rational AI" }]
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub[cli]>=1.33.0",
    "mlx-vlm>=0.7.3",
    "pillow>=12.3.0",
    "torch>=2.14",
    "torchvision>=0.29.0",
    "transformers>=5.17",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
